[notification]
background_opacity = 0.81999999999999995
collapse_on_dismiss = false
enable_daemon = true
offset_x = 20
offset_y = 16
position = "top_right"
scale = 0.90000000000000002
show_actions = true
show_app_name = true

[plugin_settings."noctalia/mpvpaper"]
video_directory = "__HOME__/Vídeos"

[plugin_settings."noctalia/wallhaven"]
download_dir = ""

[plugin_settings."salemsayed/codexbar-meter"]
barProviderLimit = 1
codexbarPath = "__HOME__/.local/bin/codexbar"
refreshIntervalSec = 60

[plugins]
enabled = [
    "noctalia/mpvpaper",
    "noctalia/wallhaven",
    "noctalia/bongocat",
    "fel/ocr",
    "decksters-lab/palette-creator",
    "icefish/phone-connect",
    "thepunkoff/pomodoro",
    "icefish/phone-operate",
    "salemsayed/codexbar-meter"
]

[shell]
app_icon_color = "primary"
app_icon_colorize = false
font_family = "Ubuntu Sans"
lang = "es"
settings_show_advanced = true

    [shell.launcher]
    compact = true

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    open_near_click_launcher = true
    polkit_placement = "attached"
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true

    [shell.shadow]
    direction = "center"

[theme]
builtin = "Tokyo-Night"
community_palette = "spiderman"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "alacritty", "gtk3", "gtk4", "niri" ]
    community_ids = [ "obsidian", "vscode", "fuzzel" ]

[widget.Teclado]
enabled = false
type = "custom_button"

    [widget.Teclado.actions]
    left = "exec pkill -RTMIN wvkbd-mobintl || wvkbd-mobintl -L 300 --hidden"

[widget.bar]
type = "icefish/phone-connect:bar"

[widget.bar_2]
type = "salemsayed/codexbar-meter:bar"

[widget.battery]
display_mode = "graphic"
show_label = false

[widget.brightness]
show_label = false

[widget.cat]
audio_spectrum = true
tappy_mode = true
type = "noctalia/bongocat:cat"
use_mpris_filter = true

[widget.clock]
format = "{:%d de %B, %H:%M}"

[widget.media]
capsule = true
hide_when_no_media = true

[widget.mpvpaper]
type = "noctalia/mpvpaper:mpvpaper"

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.ocr]
enabled = false
type = "fel/ocr:ocr"

[widget.status]
enabled = false
type = "icefish/phone-operate:status"

[widget.toggle]
enabled = false
type = "decksters-lab/palette-creator:toggle"

[widget.volume]
show_label = false

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.widget]
type = "thepunkoff/pomodoro:widget"
[wallpaper]
directory = "__HOME__/Imágenes"
transition = ["fade"]
transition_on_startup = true
[wallpaper.default]
path = "__HOME__/Imágenes/Brave-Liquid-Graphite.png"
[[plugins.source]]
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
name = "official"
[[plugins.source]]
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"
name = "community"
