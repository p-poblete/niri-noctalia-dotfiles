live_config_reload = true
import = [
    "__HOME__/.config/niri-session/alacritty/themes/noctalia.toml"
]

[window]
padding = { x = 18, y = 18 }
decorations = "None"
opacity = 0.90
blur = true

[cursor]
style = { shape = "Block", blinking = "Off" }

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[font]
size = 11.0
normal = { family = "Ubuntu Sans Mono", style = "Regular" }
bold = { family = "Ubuntu Sans Mono", style = "Bold" }
italic = { family = "Ubuntu Sans Mono", style = "Italic" }
bold_italic = { family = "Ubuntu Sans Mono", style = "Bold Italic" }
