[Service]
Environment=XDG_CONFIG_HOME=__HOME__/.config/niri-session
Environment=DCONF_PROFILE=__HOME__/.config/niri/dconf-profile
Environment=XDG_CURRENT_DESKTOP=niri
Environment=XDG_SESSION_DESKTOP=niri
ExecStartPre=__HOME__/.local/bin/niri-session-environment start
ExecStopPost=__HOME__/.local/bin/niri-session-environment stop

[Unit]
Wants=niri-alacritty-theme-sync.service
